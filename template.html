<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{name}} | Portfolio</title>

<style>
body{
  font-family: 'Segoe UI', sans-serif;
  background:#0a0a0f;
  color:#e8e8f0;
  margin:0;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:40px;
}

h1{
  font-size:50px;
  text-align:center;
  color:#7c6aff;
}

.about{
  text-align:center;
  color:#aaa;
  margin-bottom:40px;
}

.section{
  margin-top:50px;
}

.section h2{
  color:#ff6ab4;
  margin-bottom:20px;
}

.card{
  background:#16161f;
  padding:20px;
  border-radius:12px;
  margin-bottom:15px;
}

/* skills */
.tag{
  display:inline-block;
  background:#7c6aff;
  padding:6px 12px;
  margin:5px;
  border-radius:20px;
  font-size:14px;
}

/* projects */
.project{
  margin-bottom:15px;
}
.project h3{
  margin:0;
  color:#6affd4;
}
.project p{
  margin:5px 0;
  color:#bbb;
}

.footer{
  text-align:center;
  margin-top:60px;
  color:#777;
}
</style>

</head>

<body>

<div class="container">

<h1>{{name}}</h1>
<p class="about">{{about}}</p>

<div class="section">
<h2>Skills</h2>
<div class="card">
{{skills}}
</div>
</div>

<div class="section">
<h2>Projects</h2>
<div class="card">
{{projects}}
</div>
</div>

<div class="section">
<h2>Experience</h2>
<div class="card">
{{experience}}
</div>
</div>

<div class="section">
<h2>Contact</h2>
<div class="card">
<p>Email: {{email}}</p>
</div>
</div>

<div class="footer">
Built with ❤️ using AI
</div>

</div>

</body>
</html>
